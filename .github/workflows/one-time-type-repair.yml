name: QuickServe One-Time Type Repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor == 'jamalanas760-ship-it'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Apply targeted TypeScript repairs
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/components/manage/PdfMenuManager.tsx')
          text = path.read_text()

          replacements = {
              'const accepted = (result.products ?? []).filter((p) => p.confidence >= 0.7': 'const accepted = ((result.products ?? []) as Product[]).filter((p: Product) => p.confidence >= 0.7',
              'const ids = new Set(accepted.map((p) => p.candidate_id));': 'const ids = new Set(accepted.map((p: Product) => p.candidate_id));',
              'visualProducts[candidate.id] = row.product as Product;': 'visualProducts[candidate.id] = { ...row.product, candidate_id: row.candidate_id } as Product;',
          }

          changed = False
          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new, 1)
                  changed = True

          if not changed:
              raise SystemExit('No targeted repair was needed; refusing to create a no-op commit.')

          path.write_text(text)
          PY

      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/manage/PdfMenuManager.tsx
          git commit -m 'fix: resolve PDF manager type errors'
          git push
