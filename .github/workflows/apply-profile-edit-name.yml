name: Apply editable profile name

on:
  push:
    branches: [chatgpt/profile-edit-name]

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: chatgpt/profile-edit-name
          fetch-depth: 0

      - name: Apply profile name editor
        run: python .github/scripts/apply-profile-edit-name.py

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate routes and build
        run: bun run build

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Lint
        run: bun run lint

      - name: Production build
        run: bun run build

      - name: Verify requested behavior
        run: |
          grep -q 'EditableNameTile' src/routes/_authenticated/profile.tsx
          grep -q 'supabase.auth.updateUser' src/routes/_authenticated/profile.tsx
          grep -q 'update({ name: nextName })' src/routes/_authenticated/profile.tsx
          grep -q 'membership?.role === "restaurant_admin"' src/routes/_authenticated/profile.tsx

      - name: Remove one-time helpers
        run: rm -f .github/scripts/apply-profile-edit-name.py .github/workflows/apply-profile-edit-name.yml

      - name: Commit validated implementation
        run: |
          git config user.name "QuickServe Upgrade Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: let restaurant managers edit their profile name"
          git push origin HEAD:chatgpt/profile-edit-name
