name: Apply unified sign-in

on:
  push:
    branches: [chatgpt/unified-sign-in]

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: chatgpt/unified-sign-in
          fetch-depth: 0

      - name: Apply unified sign-in
        run: python .github/scripts/unify_landing_sign_in.py

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate routes and build
        run: bun run build

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Lint
        run: bun run lint

      - name: Production build
        run: bun run build

      - name: Verify unified public sign-in
        run: |
          grep -q '"Sign in"' src/routes/index.tsx
          ! grep -q 'Admin sign in' src/routes/index.tsx
          ! grep -q 'Staff sign in with PIN' src/routes/index.tsx
          ! grep -q '<Link to="/staff">' src/routes/index.tsx

      - name: Remove one-time helpers
        run: rm -f .github/scripts/unify_landing_sign_in.py .github/workflows/apply-unified-sign-in.yml

      - name: Commit validated implementation
        run: |
          git config user.name "QuickServe Upgrade Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: unify public sign-in entry"
          git push origin HEAD:chatgpt/unified-sign-in
