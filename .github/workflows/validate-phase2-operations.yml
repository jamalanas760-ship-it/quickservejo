name: Validate Phase 2 operations

on:
  push:
    branches: [chatgpt/phase2-operations-shifts]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chatgpt/phase2-operations-shifts
          fetch-depth: 0
      - name: Apply targeted UI integration patches
        run: python .github/scripts/apply_phase2_ui_links.py
      - name: Repair generated JSX syntax
        run: python .github/scripts/fix_phase2_syntax.py
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Production build
        run: bun run build
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Lint
        run: bun run lint
      - name: Phase 2 assertions
        run: |
          grep -q 'createFileRoute("/_authenticated/shifts")' src/routes/_authenticated/shifts.tsx
          grep -q 'createFileRoute("/_authenticated/automations")' src/routes/_authenticated/automations.tsx
          grep -q 'ShiftHandoverPanel' src/routes/_authenticated/work.tsx
          grep -q 'OperationsPulse' src/routes/_authenticated/manager.tsx
          grep -q 'waiter_call_created' supabase/migrations/20260917120000_operations_automation_shifts.sql
          grep -q 'shift_status_automation' supabase/migrations/20260917121500_operations_automation_shifts_hardening.sql
      - name: Remove one-time validation helpers
        run: rm .github/scripts/apply_phase2_ui_links.py .github/scripts/fix_phase2_syntax.py .github/workflows/validate-phase2-operations.yml
      - name: Commit validated implementation
        run: |
          git config user.name "QuickServe Upgrade Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
          else
            git commit -m "feat: complete phase2 shifts automation workspace"
            git push origin HEAD:chatgpt/phase2-operations-shifts
          fi
