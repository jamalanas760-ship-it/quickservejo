name: QuickServe Professional Finish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-professional-finish.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Repair staff editor JSX
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/manage/StaffManagerAdvanced.tsx')
          text = path.read_text()
          broken = '<SelectItem value="inactive">{t("common.inactive")}</SelectContent></Select>'
          fixed = '<SelectItem value="inactive">{t("common.inactive")}</SelectItem></SelectContent></Select>'
          if broken in text:
              text = text.replace(broken, fixed, 1)
          elif fixed not in text:
              raise SystemExit('Expected staff status filter marker not found')
          path.write_text(text)
          PY

      - name: Validate production build
        run: bun run build

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Lint
        run: bun run lint

      - name: Clean temporary workflows and commit verified fix
        shell: bash
        run: |
          git rm -f .github/workflows/one-shot-table-preview.yml || true
          git rm -f .github/workflows/one-shot-professional-finish.yml || true
          git diff --check
          git config user.name "quickserve-automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/manage/StaffManagerAdvanced.tsx .github/workflows || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix(staff): repair editor build and finalize verified UI changes"
          git push origin HEAD:main
