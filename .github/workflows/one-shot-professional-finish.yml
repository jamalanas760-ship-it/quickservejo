name: QuickServe Professional Finish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-professional-finish.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply strict-safe UI repairs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str, label: str):
              text = path.read_text()
              if old in text:
                  text = text.replace(old, new, 1)
                  path.write_text(text)
                  print(f'fixed: {label}')
                  return
              if new in text:
                  print(f'already fixed: {label}')
                  return
              raise SystemExit(f'marker not found: {label}')

          staff = Path('src/components/manage/StaffManagerAdvanced.tsx')
          replace_once(
              staff,
              '<SelectItem value="inactive">{t("common.inactive")}</SelectContent></Select>',
              '<SelectItem value="inactive">{t("common.inactive")}</SelectItem></SelectContent></Select>',
              'staff status select JSX',
          )
          replace_once(
              staff,
              'src={editing.avatar_url || avatarPresetUrl(editing.avatar_preset)}',
              'src={(editing.avatar_url || avatarPresetUrl(editing.avatar_preset)) ?? undefined}',
              'staff avatar strict src type',
          )

          analytics = Path('src/components/manage/AnalyticsManagerPro.tsx')
          replace_once(
              analytics,
              'import { useI18n } from "@/lib/i18n";',
              'import { useI18n, type Language } from "@/lib/i18n";',
              'analytics language type import',
          )
          replace_once(
              analytics,
              '({ name, nameAr: value.nameAr, ...value })',
              '({ name, ...value })',
              'analytics duplicate product field',
          )
          replace_once(
              analytics,
              'chartType?: ChartType; data: any; currency: string; lang: string;',
              'chartType?: ChartType | undefined; data: any; currency: string; lang: Language;',
              'analytics widget strict optional and language types',
          )
          replace_once(
              analytics,
              'currency?: string; lang?: string })',
              'currency?: string; lang?: Language | undefined })',
              'analytics series language type',
          )

          tables = Path('src/components/manage/TablesManagerPro.tsx')
          replace_once(
              tables,
              'previewMaterial?:Material;previewShape?:Shape;previewCapacity?:number;',
              'previewMaterial?:Material|undefined;previewShape?:Shape|undefined;previewCapacity?:number|undefined;',
              'table preview strict optional props',
          )
          PY

      - name: Validate production build
        run: bun run build

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Lint
        run: bun run lint

      - name: Clean temporary workflows and commit verified fix
        shell: bash
        run: |
          git rm -f .github/workflows/one-shot-table-preview.yml || true
          git rm -f .github/workflows/one-shot-professional-finish.yml || true
          git diff --check
          git config user.name "quickserve-automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/manage/StaffManagerAdvanced.tsx src/components/manage/AnalyticsManagerPro.tsx src/components/manage/TablesManagerPro.tsx .github/workflows || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix(ui): finalize staff analytics tables and verified build"
          git push origin HEAD:main
