name: Apply account operations master fix

on:
  push:
    branches: [chatgpt/account-ops-master-fix]

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: chatgpt/account-ops-master-fix
          fetch-depth: 0

      - name: Apply targeted patch
        run: python .github/scripts/account_ops_master_fix.py

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate route tree
        run: bun run build

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Lint
        run: bun run lint

      - name: Production build
        run: bun run build

      - name: Verify requested fixes
        run: |
          grep -q 'host: "/host"' src/lib/permissions.ts
          grep -q 'touch_my_presence' src/hooks/usePresenceHeartbeat.ts
          grep -q 'update_own_display_name' src/components/manage/StaffManagerAdvanced.tsx
          grep -q 'DeleteShiftDialog' src/routes/_authenticated/shifts.tsx
          grep -q 'AccountCoverEditor' src/routes/_authenticated/profile.tsx
          grep -q 'last_seen_at' supabase/migrations/20260917103500_account_presence_cover_shift_self_service.sql

      - name: Remove one-time helpers
        run: rm -f .github/scripts/account_ops_master_fix.py .github/workflows/apply-account-ops-master-fix.yml

      - name: Commit validated implementation
        run: |
          git config user.name "QuickServe Upgrade Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: harden host shifts presence and account settings"
          git push origin HEAD:chatgpt/account-ops-master-fix
