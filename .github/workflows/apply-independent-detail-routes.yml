name: Apply independent QuickServe detail routes

on:
  push:
    branches: [chatgpt/quickserve-independent-detail-routes]

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: chatgpt/quickserve-independent-detail-routes
          fetch-depth: 0

      - name: Apply route upgrade
        run: python .github/scripts/upgrade-independent-detail-routes.py

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate route tree and build
        run: bun run build

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Lint
        run: bun run lint

      - name: Production build
        run: bun run build

      - name: Verify requested behaviors
        run: |
          test -f 'src/routes/_authenticated/dashboard_/$metric.tsx'
          test -f 'src/routes/_authenticated/manage/$restaurantId/analytics_/$widgetId.tsx'
          grep -q 'href={`/dashboard/${id}`}' src/routes/_authenticated/dashboard.tsx
          grep -q 'href={`/manage/${restaurantId}/analytics/${id}`}' src/components/manage/AnalyticsManagerPro.tsx
          grep -q 'href={`${base}/${id}`}' src/components/manage/AnalyticsDetailPage.tsx
          grep -q 'setActiveZone("all");setSelectedZoneId(zone.id);' src/components/manage/TablesManagerPro.tsx
          grep -q 'All Zones' src/components/manage/TablesManagerPro.tsx
          grep -q 'ApplicationColorStudio' src/components/manage/RestaurantAppearance.tsx

      - name: Remove one-time helpers
        run: rm -f .github/scripts/upgrade-independent-detail-routes.py .github/workflows/apply-independent-detail-routes.yml

      - name: Commit validated implementation
        run: |
          git config user.name "QuickServe Upgrade Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: add independent QuickServe detail routes"
          git push origin HEAD:chatgpt/quickserve-independent-detail-routes
