name: Apply QuickServe upgrade

on:
  push:
    branches: [chatgpt/quickserve-detail-pages-v2]

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout upgrade branch
        uses: actions/checkout@v6
        with:
          ref: chatgpt/quickserve-detail-pages-v2
          fetch-depth: 0

      - name: Apply targeted upgrade
        run: python .github/scripts/quickserve_upgrade.py

      - name: Apply lint-safe follow-up
        run: python .github/scripts/fix_upgrade_lint.py

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate and build
        run: bun run build

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Lint
        run: bun run lint

      - name: Production build
        run: bun run build

      - name: Verify critical zone regression fix
        run: |
          grep -q 'setActiveZone("all");setSelectedZoneId(zone.id);' src/components/manage/TablesManagerPro.tsx
          grep -q 'All Zones' src/components/manage/TablesManagerPro.tsx
          grep -q 'HomeMetricDetail' src/routes/_authenticated/dashboard.tsx
          grep -q 'AnalyticsDetailPage' src/components/manage/AnalyticsManagerPro.tsx

      - name: Remove one-time upgrade helpers
        run: rm -f .github/scripts/quickserve_upgrade.py .github/scripts/fix_upgrade_lint.py .github/workflows/apply-quickserve-upgrade.yml

      - name: Commit validated implementation
        run: |
          git config user.name "QuickServe Upgrade Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: modernize QuickServe details colors and zones"
          git push origin HEAD:chatgpt/quickserve-detail-pages-v2
