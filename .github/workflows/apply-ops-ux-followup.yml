name: Apply operations UX follow-up

on:
  push:
    branches:
      - chatgpt/ops-ux-master-release

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: ${{ !contains(github.event.head_commit.message, '[ops-ux-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/ops-ux-master-release
          fetch-depth: 0
      - name: Apply targeted patches
        run: python .github/scripts/ops_ux_followup.py
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Generate route tree
        run: bun run build >/dev/null
      - name: Typecheck
        run: bun x tsc --noEmit
      - name: Lint
        run: bun run lint
      - name: Production build
        run: bun run build
      - name: Remove one-time helpers
        run: rm -f .github/scripts/ops_ux_followup.py .github/workflows/apply-ops-ux-followup.yml
      - name: Commit validated follow-up
        run: |
          git config user.name "QuickServe Upgrade Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: finalize operations UX release [ops-ux-applied]"
          git push origin HEAD:chatgpt/ops-ux-master-release
