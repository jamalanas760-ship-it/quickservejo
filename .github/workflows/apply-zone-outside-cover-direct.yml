name: Apply outside-zone and cover interaction fixes

on:
  push:
    branches: [chatgpt/fix-zone-outside-cover-direct]

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: chatgpt/fix-zone-outside-cover-direct
          fetch-depth: 0

      - name: Apply requested fixes
        run: python .github/scripts/fix_zone_outside_cover_direct.py

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate/build
        run: bun run build

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Lint
        run: bun run lint

      - name: Production build
        run: bun run build

      - name: Verify requested behaviors
        run: |
          grep -q 'const OUTSIDE_ZONE="__outside__";' src/components/manage/TablesManagerPro.tsx
          grep -q 'zoneContaining(layout,floor.zones)?.id??OUTSIDE_ZONE' src/components/manage/TablesManagerPro.tsx
          ! grep -q 'zoneContaining(layout,floor.zones)?.id??null' src/components/manage/TablesManagerPro.tsx
          grep -q 'onPointerDown={beginDrag}' src/components/profile/RestaurantProfileSettings.tsx
          grep -q 'Drag the image itself to choose what stays visible' src/components/profile/RestaurantProfileSettings.tsx
          ! grep -q 'type="range"' src/components/profile/RestaurantProfileSettings.tsx

      - name: Remove one-time helpers
        run: rm -f .github/scripts/fix_zone_outside_cover_direct.py .github/workflows/apply-zone-outside-cover-direct.yml

      - name: Commit validated implementation
        run: |
          git config user.name "QuickServe Upgrade Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: support tables outside zones and direct cover positioning"
          git push origin HEAD:chatgpt/fix-zone-outside-cover-direct
