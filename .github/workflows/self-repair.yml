name: QuickServe Self Repair Review
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quickserve-self-repair-review
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Prepare suggested repairs in an isolated checkout
        run: |
          node scripts/pdf-menu-migration.mjs
          node scripts/self-repair.mjs
          node scripts/manual-menu-repair.mjs
          node scripts/release-repair.mjs
      - run: bun run build
      - run: bunx tsc --noEmit
      - run: bun run test:contracts
      - run: bun run lint
      - name: Produce review patch
        run: git diff --binary > suggested-repairs.patch
      - uses: actions/upload-artifact@v4
        with:
          name: suggested-repairs-review-before-applying
          path: suggested-repairs.patch
