name: QuickServe Self Repair & Build

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: quickserve-self-repair-main
  cancel-in-progress: false

jobs:
  repair-and-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply AI Menu Studio hardening
        run: node scripts/ai-menu-studio-hardening.mjs

      - name: Apply deterministic self-repairs
        run: node scripts/self-repair.mjs

      - name: Apply release type repairs
        run: node scripts/release-repair.mjs

      - name: Commit safe repairs
        run: |
          if git diff --quiet; then
            echo "No automatic repairs needed."
            exit 0
          fi
          git config user.name "quickserve-self-repair[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src scripts tsconfig.json
          git commit -m "chore: self-repair and harden studio [skip self-repair]"
          git push origin HEAD:main

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Lint
        run: bun run lint

      - name: Production build
        run: bun run build
